name: Auto Assign
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
jobs:
  run:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      issues: write
      pull-requests: write
    steps:
    - name: Assign the issue or pull request
      env:
        GH_TOKEN: ${{ github.token }}
        ITEM_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      run: |
        gh api --silent --method POST \
          "repos/$GITHUB_REPOSITORY/issues/$ITEM_NUMBER/assignees" \
          -f 'assignees[]=danielmigueltejedor'
