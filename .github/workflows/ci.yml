name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate tokens (aliases, layering, WCAG contrast) and component CSS
        run: npm run validate
      - name: Build and unit tests
        run: npm test
      - name: Builds are reproducible
        run: npm run check:repro
      - name: Rust crate nodalia-theme (format, lints, tests with and without egui)
        working-directory: packages/egui/crate
        run: |
          cargo fmt --check
          cargo clippy --all-targets --features engineering -- -D warnings
          cargo test
          cargo test --features engineering
      - name: Install Chromium for browser tests
        run: npx playwright-core install --with-deps chromium
      - name: Browser tests (mode cascade, accessibility with axe, keyboard behaviour, demos)
        run: npm run test:browser
      - name: Package the catalog
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: apps/catalog/dist/
          retention-days: 7
          if-no-files-found: error

  update-crate:
    # The in-app updater every Nodalia app ships. Each system runs its own install path for
    # real: macOS mounts an ad-hoc signed disk image and runs the helper, Windows runs the MSI
    # helper with a stand-in msiexec, Linux swaps an AppImage. A break here breaks every app.
    name: Rust crate nodalia-update (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packages/update/crate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Lints, without and with the egui windows
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features egui -- -D warnings
      - name: Tests, including this system's install path end to end
        run: cargo test --features egui
      - name: Release-mode helper ignores the test hooks
        run: cargo test --release --lib -- helper --skip end_to_end

  gtk-crate:
    name: Rust crate nodalia-gtk (GTK 4.20)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Ubuntu's GTK is older than the 4.20 the crate needs; Fedora 43 ships it.
    container: fedora:43
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4 and Rust
        run: dnf install -y --setopt=install_weak_deps=False gtk4-devel gcc cargo clippy rustfmt python3-gobject python3-cairo gobject-introspection xorg-x11-server-Xvfb
      - name: Format, lints and tests
        working-directory: packages/gtk/crate
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          xvfb-run -a cargo test
      - name: GTK parses every stylesheet and resolves every variable
        run: xvfb-run -a python3 packages/gtk/tools/check-gtk.py
