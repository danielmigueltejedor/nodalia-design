name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate tokens (aliases, layering, WCAG contrast) and component CSS
        run: npm run validate
      - name: Build and unit tests
        run: npm test
      - name: Builds are reproducible
        run: npm run check:repro
      - name: Rust crate nodalia-theme (format, lints, tests with and without egui)
        working-directory: packages/egui/crate
        run: |
          cargo fmt --check
          cargo clippy --all-targets --features egui -- -D warnings
          cargo test
          cargo test --features egui
      - name: Install Chromium for browser tests
        run: npx playwright-core install --with-deps chromium
      - name: Browser tests (mode cascade, accessibility with axe, keyboard behaviour, demos)
        run: npm run test:browser
      - name: Package the catalog
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: apps/catalog/dist/
          retention-days: 7
          if-no-files-found: error
