name: Release (draft)

# Pushing a tag vX.Y.Z[-pre.N] runs the full verification and prepares a DRAFT release with the packages as assets.
# Nothing is published automatically: a maintainer reviews the draft, then publishes it by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: The tag must match the package versions
        run: |
          v="${GITHUB_REF_NAME#v}"
          for p in tokens icons gtk qml qtwidgets web; do
            [ "$(node -p "require('./packages/$p/package.json').version")" = "$v" ] || { echo "packages/$p version does not match $GITHUB_REF_NAME"; exit 1; }
          done
      - name: The Rust crate carries the same version
        run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" packages/egui/crate/Cargo.toml
      - run: npm run validate
      - run: npm test
      - run: npm run check:repro
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
      - name: Pack
        run: |
          mkdir -p release
          for p in tokens icons gtk qml qtwidgets web; do npm pack -w "@nodalia/$p" --pack-destination release; done
          tar -czf "release/nodalia-design-catalog-${GITHUB_REF_NAME}.tar.gz" -C apps/catalog/dist .
          (cd release && sha256sum * > SHA256SUMS)
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--draft --generate-notes"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease";; esac
          gh release create "$GITHUB_REF_NAME" $flags release/*
