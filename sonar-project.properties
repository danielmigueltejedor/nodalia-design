sonar.projectKey=danielmigueltejedor_nodalia-design
sonar.organization=danielmigueltejedor
sonar.projectName=nodalia-design
sonar.sources=packages,apps,scripts
# GTK sheets are GTK CSS, not web CSS, and the web CSS rules misread every
# GTK node name, pseudo-class and -gtk-* property as a bug. They are checked by
# loading them into real GTK instead (packages/gtk/tools/check-gtk.py, in CI).
sonar.exclusions=**/dist/**,**/node_modules/**,**/test/**,tests/**,**/*.md,packages/gtk/**/*.css
sonar.tests=packages,apps,tests
sonar.test.inclusions=**/test/**/*.mjs,tests/**/*.mjs
sonar.sourceEncoding=UTF-8
sonar.javascript.file.suffixes=.js,.mjs
