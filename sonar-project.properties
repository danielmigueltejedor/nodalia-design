sonar.projectKey=danielmigueltejedor_nodalia-design
sonar.organization=danielmigueltejedor
sonar.projectName=nodalia-design
sonar.sources=packages,apps,scripts
sonar.exclusions=**/dist/**,**/node_modules/**,**/test/**,tests/**,**/*.md
sonar.tests=packages,apps,tests
sonar.test.inclusions=**/test/**/*.mjs,tests/**/*.mjs
sonar.sourceEncoding=UTF-8
sonar.javascript.file.suffixes=.js,.mjs
# GTK CSS is not web CSS: its node names (headerbar, ndl-row), pseudo-classes
# (:backdrop), -gtk-* properties and @define-color are all valid to GTK and
# unknown to the web CSS rules. Scoped to the GTK sheets only.
sonar.issue.ignore.multicriteria=gtk1,gtk2,gtk3,gtk4,gtk5,gtk6
sonar.issue.ignore.multicriteria.gtk1.ruleKey=css:S4654
sonar.issue.ignore.multicriteria.gtk1.resourceKey=packages/gtk/**/*.css
sonar.issue.ignore.multicriteria.gtk2.ruleKey=css:S4659
sonar.issue.ignore.multicriteria.gtk2.resourceKey=packages/gtk/**/*.css
sonar.issue.ignore.multicriteria.gtk3.ruleKey=css:S4670
sonar.issue.ignore.multicriteria.gtk3.resourceKey=packages/gtk/**/*.css
sonar.issue.ignore.multicriteria.gtk4.ruleKey=css:S4660
sonar.issue.ignore.multicriteria.gtk4.resourceKey=packages/gtk/**/*.css
sonar.issue.ignore.multicriteria.gtk5.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.gtk5.resourceKey=packages/gtk/**/*.css
sonar.issue.ignore.multicriteria.gtk6.ruleKey=css:S4649
sonar.issue.ignore.multicriteria.gtk6.resourceKey=packages/gtk/**/*.css
