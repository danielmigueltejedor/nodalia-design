[package]
name = "nodalia-update"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "In-app updates for Nodalia apps: check GitHub Releases, verify the package, replace the AppImage or the macOS app and restart."
repository = "https://github.com/danielmigueltejedor/nodalia-design"
publish = false

[features]
# `nodalia_update::egui`: the update windows for egui apps.
egui = ["dep:egui"]

[dependencies]
# The `egui` feature needs egui 0.37's Rust 1.95; `rust-version` stays at what the core needs,
# because Cargo has no per-feature minimum and the GTK apps should not pay for the egui one.
egui = { version = "0.37", default-features = false, optional = true }
sha2 = "0.10"
serde_json = "1"
ureq = { version = "3", features = ["platform-verifier"] }

# Standalone on purpose, like nodalia-gtk: apps take this crate as a git dependency into their own
# workspace, and it has no toolkit in it, so GTK, egui and Qt-less Rust apps can all use it.
[workspace]
